networks:
  traefik-public:
    external: true

services:
  tarkov-map-website:
    image: registry.rmnad.net/tarkov-map-website:latest
    networks:
      - traefik-public
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.tarkovmapwebsite.rule=Host(`tarkov.rmnad.net`)"
        - "traefik.http.routers.tarkovmapwebsite.entrypoints=websecure"
        - "traefik.http.routers.tarkovmapwebsite.tls=true"
        - "traefik.http.routers.tarkovmapwebsite.priority=1"
        - "traefik.http.services.tarkovmapwebsite.loadbalancer.server.port=80"
        - "traefik.http.services.tarkovmapwebsite.loadbalancer.healthcheck.path=/"
        - "traefik.http.services.tarkovmapwebsite.loadbalancer.healthcheck.interval=10s"
